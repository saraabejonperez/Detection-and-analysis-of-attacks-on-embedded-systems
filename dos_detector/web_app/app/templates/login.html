{% extends "base.html" %}

{% block body_class %}body-home{% endblock %}
{% block container_class %}full-screen-container{% endblock %}

{% block content %}
<div class="transparent-card auth-card">
    <h2>Iniciar Sesión</h2>
    
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required placeholder="Introduce tu usuario">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="********">
        </div>
        
        <button type="submit" class="btn-home btn-blue">Entrar</button>
    </form>
    
    <p class="auth-footer">
        ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate aquí</a><br>
        <a href="{{ url_for('main.index') }}" class="back-link">Volver al inicio</a>
    </p>
</div>
{% endblock %}
