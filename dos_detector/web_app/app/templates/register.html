{% extends "base.html" %}

{% block body_class %}body-home{% endblock %}
{% block container_class %}full-screen-container{% endblock %}

{% block content %}
<div class="transparent-card auth-card">
    <h2>Crear Cuenta</h2>
    
    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
        <div class="form-group">
            <label for="username">Nuevo Usuario</label>
            <input type="text" id="username" name="username" required placeholder="Ej: analista_01">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
        </div>
        
        <button type="submit" class="btn-home btn-green">Registrar</button>
    </form>

    <p class="auth-footer">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a><br>
        <a href="{{ url_for('main.index') }}" class="back-link">Volver al inicio</a>
    </p>
</div>
{% endblock %}
